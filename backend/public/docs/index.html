<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Laravel MongoDB REST API - Swagger UI</title>
  <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.11.0/swagger-ui.css" />
  <link rel="icon" type="image/png" href="https://laravel.com/img/favicon/favicon-32x32.png" sizes="32x32" />
  <style>
    html {
      box-sizing: border-box;
      overflow: -moz-scrollbars-vertical;
      overflow-y: scroll;
    }
    *, *:before, *:after {
      box-sizing: inherit;
    }
    body {
      margin:0;
      background: #fafafa;
    }
    .topbar {
      display: none;
    }
    .swagger-ui .info .title {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color: #1e293b;
    }
    .custom-header {
      background: linear-gradient(90deg, #0f172a 0%, #1e1b4b 100%);
      color: white;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
    }
    .custom-header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }
    .custom-header .badge {
      background: #00ED64;
      color: #001e2b;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 9999px;
      margin-left: 12px;
    }
    .custom-header a {
      color: #93c5fd;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      border: 1px solid #3b82f6;
      padding: 6px 14px;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .custom-header a:hover {
      background: #2563eb;
      color: white;
    }
  </style>
</head>
<body>
  <div class="custom-header">
    <div style="display: flex; align-items: center;">
      <h1>Laravel MongoDB REST API Specification</h1>
      <span class="badge">MongoDB Eloquent</span>
    </div>
    <div style="display: flex; gap: 12px;">
      <a href="/admin/dashboard">&larr; Admin Dashboard</a>
      <a href="/login">Admin Login</a>
    </div>
  </div>

  <div id="swagger-ui"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.11.0/swagger-ui-bundle.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.11.0/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      const ui = SwaggerUIBundle({
        url: "/storage/api-docs/api-docs.json",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "BaseLayout"
      });
      window.ui = ui;
    };
  </script>
</body>
</html>
